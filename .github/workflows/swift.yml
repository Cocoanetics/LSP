---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # Not macos-latest: that pool currently mixes macOS 15 and 26 images, and on
  # macOS 15 test bundles built by Xcode 26's Swift fail to dlopen
  # (@rpath/libswiftCompatibilitySpan.dylib); the macOS 26 runtime ships it.
  # (Same pinning as JSONFoundation's CI.)
  #
  # Two Xcode legs on purpose: SwiftPM 6.2 and 6.3 resolve the trait-conditioned
  # swift-subprocess dependency differently, and Package.swift branches on
  # `#if compiler(>=6.3)` to serve both — each leg exercises one branch.

  build-macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.0 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      # Xcode on the runner ships sourcekit-lsp, so the live round-trip test runs
      # here too (it reports as skipped where the toolchain is absent).
      - name: Test (macOS)
        run: swift test -v --skip-build

  build-macos-latest-xcode:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      - name: Test (macOS)
        run: swift test -v --skip-build
