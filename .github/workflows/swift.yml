---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build-macos:
    # Not macos-latest: that pool currently mixes macOS 15 and 26 images, and on
    # macOS 15 test bundles built by Xcode 26's Swift fail to dlopen
    # (@rpath/libswiftCompatibilitySpan.dylib); the macOS 26 runtime ships it.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # latest-stable, not the 26.0 pin JSONFoundation's CI uses: this package
      # needs SwiftPM 6.3+ (Xcode 26.4+). Older SwiftPMs cannot see SwiftMCP's
      # trait-conditioned swift-subprocess product transitively — see the note
      # in Package.swift.
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      # Xcode on the runner ships sourcekit-lsp, so the live round-trip test runs
      # here too (it reports as skipped where the toolchain is absent).
      - name: Test (macOS)
        run: swift test -v --skip-build
